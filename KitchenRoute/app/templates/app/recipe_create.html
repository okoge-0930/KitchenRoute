{% extends "app/base.html" %}

{% block content %}

<div class="kr-page" style="
    max-width: 380px;
    margin: 24px auto;
    padding: 0 16px;
    box-sizing: border-box;
">

    <h2 style="
        text-align: center;
        font-size: 24px;
    ">
        レシピ登録
    </h2>

    {% if error %}
        <div
            class="kr-message kr-message--error"
            style="margin-bottom: 12px;"
        >
            {{ error }}
        </div>
    {% endif %}

    <form method="post" data-disable-on-submit>
        {% csrf_token %}

        <label>レシピ名</label><br>

        <input
            type="text"
            name="name"
            value="{{ form_values.name|default:'' }}"
            style="
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            "
        >

        <div style="
            margin-top: 48px;
            display: flex;
            justify-content: center;
            gap: 12px;
        ">

            <button
                class="kr-button"
                type="submit"
                style="
                    background-color: #f2c94c;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                登録
            </button>

            <button
                class="kr-button kr-button--cancel"
                type="button"
                onclick="location.href='{% url 'skill_management' %}'"
                style="
                    background-color: #2f80ed;
                    color: white;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                キャンセル
            </button>

        </div>

    </form>

</div>

{% endblock %}
