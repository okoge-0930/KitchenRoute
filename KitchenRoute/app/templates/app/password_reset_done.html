{% extends "app/base.html" %}

{% block content %}

<div style="
    max-width: 360px;
    margin: 24px auto;
    padding: 0 20px;
    text-align: center;
    box-sizing: border-box;
">

    <p style="font-size: 22px; margin: 0 0 32px;">
        パスワード再設定メールを送信しました
    </p>

    <p
        style="
            text-align: left;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 28px;
        "
    >
        入力されたメールアドレス宛に、パスワード再設定用のURLを送信しました。
    </p>

    <p
        style="
            text-align: left;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 28px;
        "
    >
        メール本文に記載のURLから、パスワードの再設定を行ってください。
    </p>

    <a class="kr-public-link" href="{% url 'login' %}">
        ログイン画面へ
    </a>

</div>

{% endblock %}
