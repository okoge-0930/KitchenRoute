{% extends "app/base.html" %}

{% block content %}

<div class="kr-page" style="
    max-width: 380px;
    margin: 24px auto;
    padding: 0 16px;
    box-sizing: border-box;
">

    <h2 style="
        text-align: center;
        font-size: 24px;
    ">
        {{ user.username }}さんのタスク
    </h2>

    {% if task_list %}
        {% for task in task_list %}
            <div class="kr-card" style="
                border: 1px solid #999;
                padding: 12px;
                margin: 0 auto 12px;
                box-sizing: border-box;
                width: 100%;
            ">

                <div style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    gap: 12px;
                    margin-bottom: 10px;
                ">
                    <strong style="
                        font-size: 16px;
                        word-break: break-word;
                    ">
                        ■ {{ task.recipe.name }}
                    </strong>

                    <button
                        class="kr-button"
                        type="button"
                        onclick="location.href='{% url 'trainee_task_detail' task.recipe.id %}'"
                        style="
                            background-color: #f2c94c;
                            border: 1px solid #999;
                            padding: 6px 12px;
                            flex-shrink: 0;
                        "
                    >
                        詳細
                    </button>
                </div>

                <p style="
                    font-size: 14px;
                    margin: 0;
                    word-break: break-word;
                ">
                    No.{{ task.step.order }}
                    {{ task.step.name }}
                </p>

            </div>
        {% endfor %}
    {% else %}
        <p style="text-align: center; font-size: 14px;">
            現在進行中のタスクはありません。
        </p>
    {% endif %}

</div>

{% endblock %}
