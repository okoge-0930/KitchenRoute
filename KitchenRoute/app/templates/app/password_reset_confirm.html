{% extends "app/base.html" %}

{% block content %}

<div style="max-width: 320px; margin: 40px auto; text-align: center;">

    <h1
        style="
            background-color: #f2c94c;
            color: white;
            padding: 12px;
            font-size: 28px;
            margin-bottom: 24px;
        "
    >
        KitchenRoute
    </h1>

    <h3 style="margin-bottom: 24px;">
        パスワード再設定
    </h3>

    <form method="post">
        {% csrf_token %}

        <div style="text-align: left;">
            <label>
                新しいパスワード（8文字以上、英数字を含む）
            </label>
        </div>

        <input
            type="password"
            name="new_password1"
            required
            style="
                width: 100%;
                padding: 8px;
                margin-top: 8px;
                margin-bottom: 20px;
                box-sizing: border-box;
            "
        >

        <div style="text-align: left;">
            <label>
                新しいパスワード（再入力）
            </label>
        </div>

        <input
            type="password"
            name="new_password2"
            required
            style="
                width: 100%;
                padding: 8px;
                margin-top: 8px;
                margin-bottom: 24px;
                box-sizing: border-box;
            "
        >

        <button
            type="submit"
            style="
                background-color: #f2c94c;
                border: 1px solid #999;
                padding: 8px 28px;
                cursor: pointer;
            "
        >
            更新
        </button>

    </form>

</div>

{% endblock %}
