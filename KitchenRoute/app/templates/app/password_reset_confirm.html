{% extends "app/base.html" %}

{% block content %}

<div style="max-width: 320px; margin: 18px auto; padding: 0 16px; text-align: center; box-sizing: border-box;">

    <div class="kr-public-logo">
        KitchenRoute
    </div>

    <h3 style="margin: 0 0 24px;">
        パスワード再設定
    </h3>

    <form method="post">
        {% csrf_token %}

        <div style="text-align: left;">
            <label>
                新しいパスワード（8文字以上、英数字を含む）
            </label>
        </div>

        <input
            type="password"
            name="new_password1"
            required
            style="
                width: 100%;
                padding: 8px;
                margin-top: 8px;
                margin-bottom: 20px;
                box-sizing: border-box;
            "
        >

        <div style="text-align: left;">
            <label>
                新しいパスワード（再入力）
            </label>
        </div>

        <input
            type="password"
            name="new_password2"
            required
            style="
                width: 100%;
                padding: 8px;
                margin-top: 8px;
                margin-bottom: 24px;
                box-sizing: border-box;
            "
        >

        <button
            class="kr-button"
            type="submit"
            style="
                background-color: #f2c94c;
                border: 1px solid #999;
                padding: 8px 28px;
                cursor: pointer;
            "
        >
            更新
        </button>

    </form>

</div>

{% endblock %}
