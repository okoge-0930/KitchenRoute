{% extends "app/base.html" %}

{% block content %}

<div style="
    max-width: 360px;
    margin: 24px auto;
    text-align: center;
    padding: 0 24px;
    box-sizing: border-box;
">

    <h2 style="
        font-size: 24px;
        margin: 0 0 28px;
        line-height: 1.5;
    ">
        アカウント登録が<br>
        完了しました
    </h2>

    <p style="font-size: 16px;">
        組織コード：{{ organization_code }}
    </p>

    <p style="
        line-height: 1.8;
        margin-top: 28px;
        font-size: 16px;
    ">
        上記の組織コードをスタッフへ共有してください。
    </p>

    <div style="
        margin-top: 40px;
        font-size: 13px;
    ">
        <a class="kr-public-link" href="{% url 'admin_home' %}">
            ホーム画面へ
        </a>
    </div>

</div>

{% endblock %}
