{% extends "app/base.html" %}

{% block content %}

<div style="max-width: 320px; margin: 40px auto; text-align: center;">

    <h1
        style="
            background-color: #f2c94c;
            color: white;
            padding: 12px;
            font-size: 28px;
            margin-bottom: 24px;
        "
    >
        KitchenRoute
    </h1>

    <h3 style="margin-bottom: 20px;">
        パスワード再設定
    </h3>

    <div
        style="
            border: 1px solid #999;
            padding: 12px;
            text-align: left;
            margin-bottom: 20px;
            font-size: 14px;
        "
    >
        登録したメールアドレスを入力してください。パスワード再設定のURLを送信します。
    </div>

    <form method="post">
        {% csrf_token %}

        <div style="text-align: left;">
            <label>
                メールアドレス
            </label>
        </div>

        <input
            type="email"
            name="email"
            required
            style="
                width: 100%;
                padding: 8px;
                margin-top: 8px;
                margin-bottom: 20px;
                box-sizing: border-box;
            "
        >

        <button
            type="submit"
            style="
                background-color: #f2c94c;
                border: 1px solid #999;
                padding: 8px 28px;
                cursor: pointer;
            "
        >
            送信
        </button>

    </form>

    <div style="margin-top: 20px;">
        <a href="{% url 'login' %}">
            ログイン画面へ
        </a>
    </div>

</div>

{% endblock %}
