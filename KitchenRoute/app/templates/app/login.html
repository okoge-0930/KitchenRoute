<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 64px;
            width: auto !important;
            max-width: 100%;
            height: 40px;
            min-height: 40px;
            padding: 0 14px !important;
            color: white;
            border: 1px solid #999;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px !important;
            font-family: inherit;
            line-height: 1.2;
            box-sizing: border-box;
            white-space: nowrap;
        }
    </style>
    <title>ログイン | KitchenRoute</title>
</head>

<body style="margin: 0;">

<div style="
    max-width: 300px;
    margin: 40px auto;
    text-align: center;
">

    <div style="
        display: inline-block;
        background-color: #f2c94c;
        color: white;
        padding: 12px 18px;
        font-size: 34px;
        font-weight: bold;
        margin-bottom: 34px;
    ">
        KitchenRoute
    </div>

    {% if error %}
        <p style="color: red; text-align: left;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div style="margin-bottom: 22px; text-align: left;">
            <label>組織コード</label><br>
            <input
                type="text"
                name="organization_code"
                required
                autocomplete="off"
                style="
                    width: 100%;
                    height: 32px;
                    box-sizing: border-box;
                "
            >
        </div>

        <div style="margin-bottom: 22px; text-align: left;">
            <label>メールアドレス</label><br>
            <input
                type="email"
                name="email"
                required
                autocomplete="off"
                style="
                    width: 100%;
                    height: 32px;
                    box-sizing: border-box;
                "
            >
        </div>

        <div style="margin-bottom: 24px; text-align: left;">
            <label>パスワード</label><br>
            <input
                type="password"
                name="password"
                required
                autocomplete="current-password"
                style="
                    width: 100%;
                    height: 32px;
                    box-sizing: border-box;
                "
            >
        </div>

        <button
            class="kr-button"
            type="submit"
            style="
                background-color: #f2c94c;
                border: 1px solid #999;
                padding: 8px 40px;
                font-size: 15px;
            "
        >
            ログイン
        </button>
    </form>

    <div style="
        margin-top: 28px;
        font-size: 13px;
        text-align: center;
    ">
        <p>
            <a href="{% url 'admin_register' %}">
                管理者用アカウント新規登録
            </a>
        </p>

        <p>
            <a href="{% url 'general_register' %}">
                一般用アカウント新規登録
            </a>
        </p>

        <p>
            パスワードを忘れた方は
            <a href="{% url 'password_reset' %}">
                こちら
            </a>
        </p>
    </div>

</div>

</body>
</html>
