<h1>KitchenRoute</h1>

<h2>教育者ホーム</h2>

<p>
    <a href="{% url 'skill_management' %}">
        スキル管理へ
    </a>
</p>

<h3>スタッフ一覧</h3>

{% if trainee_summaries %}
    <ul>
        {% for summary in trainee_summaries %}
            <li>
                <strong>{{ summary.trainee.username }}</strong><br>
                進捗率：{{ summary.progress_rate }}%<br>

                <a href="{% url 'trainee_detail' summary.trainee.id %}">
                    詳細を見る
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>表示できる新人がいません。</p>
{% endif %}
