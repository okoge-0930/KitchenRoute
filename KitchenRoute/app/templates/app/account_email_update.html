{% extends "app/base.html" %}

{% block content %}

<div style="max-width: 380px; margin: 40px auto;">

    <button
        type="button"
        onclick="location.href='{% url 'account' %}'"
        style="
            background-color: #ddd;
            border: 1px solid #999;
            padding: 6px 12px;
            margin-bottom: 20px;
        "
    >
        ＜戻る
    </button>

    <h2 style="text-align: center;">
        メールアドレス変更
    </h2>

    <br>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div style="margin-bottom: 16px;">
            <div>新しいメールアドレス</div>

            <input
                type="email"
                name="email"
                value="{{ current_email }}"
                required
                style="
                    width: 100%;
                    padding: 8px;
                    box-sizing: border-box;
                "
            >
        </div>

        <div style="text-align: center;">
            <button
                type="submit"
                style="
                    background-color: #f2c94c;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                保存する
            </button>
        </div>

    </form>

</div>

{% endblock %}
