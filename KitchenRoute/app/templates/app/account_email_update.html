{% extends "app/base.html" %}

{% block content %}

<div style="max-width: 380px; margin: 40px auto;">

    <h1>KitchenRoute</h1>

    <div style="
        border: 1px solid #ccc;
        padding: 24px;
        border-radius: 8px;
    ">

        <h2 style="text-align: center;">
            メールアドレス変更
        </h2>

        <br>

        {% if error %}
            <p style="color: red;">
                {{ error }}
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom: 16px;">
                <div>新しいメールアドレス</div>

                <input
                    type="email"
                    name="email"
                    value="{{ current_email }}"
                    required
                    style="
                        width: 100%;
                        padding: 8px;
                        box-sizing: border-box;
                    "
                >
            </div>

            <button type="submit">
                保存する
            </button>
        </form>

    </div>
</div>

{% endblock %}
