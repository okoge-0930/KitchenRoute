{% extends "app/base.html" %}

{% block content %}

<div style="max-width: 380px; margin: 16px auto;">

    <button
        class="kr-button kr-button--secondary"
        type="button"
        onclick="location.href='{% url 'account' %}'"
        style="
            background-color: #ddd;
            color: #333;
            border: 1px solid #999;
            padding: 6px 12px;
            margin-bottom: 12px;
        "
    >
        ＜戻る
    </button>

    <h2 style="text-align: center;">
        メールアドレス変更
    </h2>

    {% if errors %}
        <div style="margin-bottom: 12px;">
            {% for error in errors %}
                <div class="kr-message kr-message--error">
                    {{ error }}
                </div>
            {% endfor %}
        </div>
    {% elif error %}
        <div style="margin-bottom: 12px;">
            <div class="kr-message kr-message--error">
                {{ error }}
            </div>
        </div>
    {% endif %}

    <form method="post" data-disable-on-submit>
        {% csrf_token %}

        <div style="margin-bottom: 16px;">
            <div>新しいメールアドレス</div>

            <input
                type="email"
                name="email"
                value="{{ current_email }}"
                required
                style="
                    width: 100%;
                    padding: 8px;
                    box-sizing: border-box;
                "
            >
        </div>

        <div style="text-align: center;">
            <button
                class="kr-button"
                type="submit"
                style="
                    background-color: #f2c94c;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                保存する
            </button>
        </div>

    </form>

</div>

{% endblock %}
