{% extends "app/base.html" %}

{% block content %}

<div style="
    max-width: 360px;
    margin: 24px auto;
    padding: 0 16px;
    box-sizing: border-box;
">

    <div style="
        background-color: #f2c94c;
        text-align: center;
        padding: 16px;
        margin-bottom: 32px;
    ">
        <span style="
            color: white;
            font-size: 36px;
            font-weight: bold;
        ">
            KitchenRoute
        </span>
    </div>

    <h2 style="
        text-align: center;
        font-size: 24px;
    ">
        一般用アカウント新規登録
    </h2>

    {% if error %}
        <p style="
            color: red;
            text-align: center;
            font-size: 14px;
        ">
            {{ error }}
        </p>
    {% endif %}

    <form method="post" autocomplete="off">
        {% csrf_token %}

        <p>組織コード</p>
        <input
            type="text"
            name="organization_code"
            required
            autocomplete="off"
            style="
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            "
        >

        <p>名前</p>
        <input
            type="text"
            name="username"
            required
            autocomplete="off"
            style="
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            "
        >

        <p>メールアドレス</p>
        <input
            type="email"
            name="email"
            required
            autocomplete="off"
            style="
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            "
        >

        <p>パスワード（8文字以上、英数字を含む）</p>
        <input
            type="password"
            name="password"
            required
            autocomplete="new-password"
            style="
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            "
        >

        <p>パスワード（再入力）</p>
        <input
            type="password"
            name="password_confirm"
            required
            autocomplete="new-password"
            style="
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            "
        >

        <div style="
            margin-top: 32px;
            text-align: center;
        ">
            <button
                type="submit"
                style="
                    background-color: #f2c94c;
                    border: 1px solid #999;
                    padding: 8px 20px;
                "
            >
                登録
            </button>
        </div>

        <div style="
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
        ">
            <a href="{% url 'login' %}">
                ログイン画面へ
            </a>
        </div>
    </form>

</div>

{% endblock %}
