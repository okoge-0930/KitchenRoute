{% extends "app/base.html" %}

{% block content %}

<div style="max-width: 420px; margin: 24px auto;">

<h2 style="text-align: center;">
    管理者用アカウント新規登録
</h2>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">
    {% csrf_token %}

    <p>組織名</p>
    <input
        type="text"
        name="organization_name"
        required
    >

    <p>名前</p>
    <input
        type="text"
        name="username"
        required
    >

    <p>メールアドレス</p>
    <input
        type="email"
        name="email"
        required
    >

    <p>パスワード（8文字以上、英数字を含む）</p>
    <input
        type="password"
        name="password"
        required
    >

    <p>パスワード（再入力）</p>
    <input
        type="password"
        name="password_confirm"
        required
    >

    <div style="margin-top: 20px;">
    <button>
        登録
    </button>
</div>
</form>

<div style="margin-top: 12px;">
    <a href="{% url 'login' %}">
        ログイン画面へ
    </a>
</div>
</div>

{% endblock %}
