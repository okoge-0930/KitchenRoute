{% extends "app/base.html" %}

{% block content %}

<div class="kr-page" style="
    max-width: 380px;
    margin: 24px auto;
    padding: 0 16px;
    box-sizing: border-box;
">

    <h2 style="
        text-align: center;
        font-size: 24px;
    ">
        レシピ編集
    </h2>

    <form method="post">
        {% csrf_token %}

        {% if redirect_to %}
            <input
                type="hidden"
                name="next"
                value="{{ redirect_to }}"
            >
        {% endif %}

        <label>レシピ名</label><br>

        <input
            type="text"
            name="name"
            value="{{ recipe.name }}"
            required
            style="
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            "
        >

        <div style="
            margin-top: 48px;
            display: flex;
            justify-content: center;
            gap: 12px;
        ">

            <button
                class="kr-button"
                type="submit"
                style="
                    background-color: #f2c94c;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                保存
            </button>

            <button
                class="kr-button kr-button--cancel"
                type="button"
                onclick="history.back()"
                style="
                    background-color: #2f80ed;
                    color: white;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                キャンセル
            </button>

        </div>

    </form>

</div>

{% endblock %}
