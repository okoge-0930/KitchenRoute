{% extends "app/base.html" %}

{% block content %}

<div style="max-width: 420px; margin: 24px auto;">

    <h1>KitchenRoute</h1>

    <h2>レシピ編集</h2>

    <form method="post">
        {% csrf_token %}

        <p>レシピ名</p>

        <input
            type="text"
            name="name"
            value="{{ recipe.name }}"
            required
            style="width: 100%; padding: 8px;"
        >

        <div style="margin-top: 16px;">
            <button type="submit">
                保存
            </button>
        </div>
    </form>

</div>

{% endblock %}
