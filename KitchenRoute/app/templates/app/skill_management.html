{% extends "app/base.html" %}

{% block content %}

<h1>KitchenRoute</h1>

<h2>スキル管理</h2>
<h3>レシピ一覧</h3>

{% if recipes %}
    {% for recipe in recipes %}
        <p>
            <a href="{% url 'step_management' recipe.id %}">
                &gt;{{ recipe.name }}
            </a>
        </p>
    {% endfor %}
{% else %}
    <p>登録されたレシピはありません。</p>
{% endif %}

<hr>

<a href="{% url 'recipe_create' %}">
    レシピを追加
</a>


{% endblock %}
