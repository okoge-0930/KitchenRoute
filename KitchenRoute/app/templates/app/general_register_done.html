{% extends "app/base.html" %}

{% block content %}

<div style="
    max-width: 360px;
    margin: 24px auto;
    text-align: center;
    padding: 0 24px;
    box-sizing: border-box;
">

    <h2 style="
        font-size: 28px;
        margin: 0 0 24px;
    ">
        アカウント登録が<br>
        完了しました
    </h2>

    <p style="
        font-size: 17px;
        line-height: 1.8;
    ">
        現在は「新人」として登録されています。
    </p>

    <p style="
        font-size: 17px;
        line-height: 1.8;
    ">
        「新人」として利用する場合は、下記リンクからホーム画面へ移動してください。
    </p>

    <p style="
        line-height: 1.8;
        margin-top: 24px;
    ">
        「教育者」として利用する場合は管理者による教育者権限の設定が必要です。
    </p>

    <p style="
        line-height: 1.8;
    ">
        権限設定後、下記リンクからホーム画面へ移動してください。
    </p>

    <div style="
        margin-top: 40px;
    ">
        <a class="kr-public-link" href="{% url 'trainee_home' %}">
            ホーム画面へ
        </a>
    </div>

</div>

{% endblock %}
