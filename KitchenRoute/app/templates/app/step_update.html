<h1>KitchenRoute</h1>

<h2>工程編集</h2>

<p>レシピ名：{{ step.recipe.name }}</p>

<form method="post">
    {% csrf_token %}

    <label>順序</label><br>
    <input type="number" name="order" value="{{ step.order }}">

    <br><br>

    <label>工程名</label><br>
    <input type="text" name="name" value="{{ step.name }}">

    <br><br>

    <button type="submit">更新</button>
</form>

<br>

<a href="{% url 'step_management' step.recipe.id %}">キャンセル</a>
