{% extends "app/base.html" %}

{% block content %}

<div style="max-width: 420px; margin: 24px auto;">

    <h2 style="text-align: center;">
        工程編集
    </h2>

    <p>
        レシピ名：{{ step.recipe.name }}
    </p>

    <form method="post">
        {% csrf_token %}

        <label>順序</label><br>

        <input
            type="number"
            name="order"
            value="{{ step.order }}"
            style="width: 100%; padding: 8px;"
        >

        <br><br>

        <label>工程名</label><br>

        <input
            type="text"
            name="name"
            value="{{ step.name }}"
            style="width: 100%; padding: 8px;"
        >

        <div style="
            margin-top: 16px;
            display: flex;
            gap: 12px;
        ">

            <button
                type="submit"
                style="
                    background-color: #f2c94c;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                更新
            </button>

            <button
                type="button"
                onclick="location.href='{% url 'step_management' step.recipe.id %}'"
                style="
                    background-color: #2f80ed;
                    color: white;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                キャンセル
            </button>

        </div>

    </form>

</div>

{% endblock %}
