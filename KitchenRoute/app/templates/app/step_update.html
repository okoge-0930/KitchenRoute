{% extends "app/base.html" %}

{% block content %}

<div style="
    max-width: 380px;
    margin: 24px auto;
    padding: 0 16px;
    box-sizing: border-box;
">

    <h2 style="
        text-align: center;
        font-size: 24px;
    ">
        工程編集
    </h2>

    <p style="
        text-align: center;
        font-size: 18px;
        font-weight: bold;
    ">
        レシピ名　{{ step.recipe.name }}
    </p>

    <form method="post">
        {% csrf_token %}

        <label>順序（半角数字入力）</label><br>

        <input
            type="number"
            name="order"
            value="{{ step.order }}"
            min="1"
            step="1"
            inputmode="numeric"
            required
            style="
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            "
        >

        <br><br>

        <label>工程名</label><br>

        <input
            type="text"
            name="name"
            value="{{ step.name }}"
            required
            style="
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            "
        >

        <div style="
            margin-top: 48px;
            display: flex;
            justify-content: center;
            gap: 12px;
        ">

            <button
                class="kr-button"
                type="submit"
                style="
                    background-color: #f2c94c;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                更新
            </button>

            <button
                class="kr-button kr-button--cancel"
                type="button"
                onclick="location.href='{% url 'step_management' step.recipe.id %}'"
                style="
                    background-color: #2f80ed;
                    color: white;
                    border: 1px solid #999;
                    padding: 8px 16px;
                "
            >
                キャンセル
            </button>

        </div>

    </form>

</div>

{% endblock %}
