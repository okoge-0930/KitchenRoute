{% extends "app/base.html" %}

{% block content %}

<div style="
    max-width: 360px;
    margin: 24px auto;
    padding: 0 20px;
    text-align: center;
    box-sizing: border-box;
">

    <p style="font-size: 22px; margin: 0 0 32px;">
        パスワード再設定が完了しました
    </p>

    {% if messages %}
        <div class="kr-message-list">
            {% for message in messages %}
                <div class="kr-message kr-message--success">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <p style="
        line-height: 1.8;
        font-size: 14px;
        margin-bottom: 28px;
    ">
        ログイン画面へ戻り、新しいパスワードでログインしてください。
    </p>

    <p>
        <a class="kr-public-link" href="{% url 'login' %}">
            ログイン画面へ
        </a>
    </p>

</div>

{% endblock %}
