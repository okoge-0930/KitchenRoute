{% extends "app/base.html" %}

{% block content %}

<div style="
    max-width: 380px;
    margin: 24px auto;
    padding: 0 16px;
    box-sizing: border-box;
">

    <button
        type="button"
        onclick="location.href='{% url 'skill_management' %}'"
        style="
            background-color: #ddd;
            border: 1px solid #999;
            padding: 6px 12px;
            margin-bottom: 8px;
        "
    >
        ＜戻る
    </button>

    <h2 style="
        text-align: center;
        font-size: 24px;
        margin-top: 0;
    ">
        スキル管理
    </h2>

    <h3 style="
        text-align: center;
        font-size: 18px;
    ">
        工程一覧
    </h3>

    <div style="
        border: 1px solid #999;
        padding: 12px;
        margin-bottom: 16px;
        box-sizing: border-box;
    ">
        <div style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        ">
            <strong style="
                font-size: 18px;
                word-break: break-word;
            ">
                レシピ名　{{ recipe.name }}
            </strong>

            <div style="
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            ">
                <button
                    type="button"
                    onclick="location.href='{% url 'recipe_update' recipe.id %}'"
                    style="
                        background-color: #f2c94c;
                        border: 1px solid #999;
                        padding: 4px 10px;
                    "
                >
                    編集
                </button>

                <form
                    method="post"
                    action="{% url 'recipe_delete' recipe.id %}"
                    style="margin: 0;"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        style="
                            background-color: #eb5757;
                            color: white;
                            border: 1px solid #999;
                            padding: 4px 10px;
                        "
                        onclick="return confirm('⚠️警告\nレシピ削除をすると登録された全工程も削除されます。\n本当に削除しますか？')"
                    >
                        削除
                    </button>
                </form>
            </div>
        </div>
    </div>

    {% if steps %}
        {% for step in steps %}
            <div style="
                border: 1px solid #999;
                padding: 10px;
                margin-bottom: 10px;
                box-sizing: border-box;
            ">
                <div style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    gap: 12px;
                    font-size: 14px;
                ">
                    <span style="word-break: break-word;">
                        No.{{ step.order }}
                        {{ step.name }}
                    </span>

                    <div style="
                        display: flex;
                        gap: 8px;
                        flex-shrink: 0;
                    ">
                        <button
                            type="button"
                            onclick="location.href='{% url 'step_update' step.id %}'"
                            style="
                                background-color: #f2c94c;
                                border: 1px solid #999;
                                padding: 4px 10px;
                            "
                        >
                            編集
                        </button>

                        <form
                            method="post"
                            action="{% url 'step_delete' step.id %}"
                            style="margin: 0;"
                        >
                            {% csrf_token %}

                            <button
                                type="submit"
                                style="
                                    background-color: #eb5757;
                                    color: white;
                                    border: 1px solid #999;
                                    padding: 4px 10px;
                                "
                                onclick="return confirm('⚠️警告\nこの操作は元に戻せません。\n工程を削除しますか？')"
                            >
                                削除
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p style="text-align: center; font-size: 14px;">
            登録された工程はありません。
        </p>
    {% endif %}

    <div style="
        text-align: center;
        margin-top: 24px;
    ">
        <button
            type="button"
            onclick="location.href='{% url 'step_create' recipe.id %}'"
            style="
                background-color: #f2c94c;
                border: 1px solid #999;
                padding: 8px 16px;
            "
        >
            工程を追加
        </button>
    </div>

</div>

{% endblock %}
