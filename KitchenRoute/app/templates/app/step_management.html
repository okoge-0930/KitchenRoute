{% extends "app/base.html" %}

{% block content %}

<div class="kr-page" style="
    max-width: 420px;
    margin: 24px auto;
    padding: 0 16px;
    box-sizing: border-box;
">

    <button
        class="kr-button kr-button--secondary"
        type="button"
        onclick="location.href='{% url 'skill_management' %}'"
        style="
            background-color: #ddd;
            color: #333;
            border: 1px solid #999;
            padding: 6px 12px;
            margin-bottom: 8px;
        "
    >
        ＜戻る
    </button>

    <h2 style="
        text-align: center;
        font-size: 24px;
        margin-top: 0;
    ">
        スキル管理
    </h2>

    <h3 style="
        text-align: center;
        font-size: 18px;
    ">
        工程一覧
    </h3>

    <div class="kr-card" style="
        border: 1px solid #999;
        padding: 12px;
        margin-bottom: 16px;
        box-sizing: border-box;
        text-align: center;
    ">
        <div style="
            font-size: 15px;
            margin-bottom: 6px;
        ">
            レシピ名
        </div>

        <strong style="
            display: block;
            font-size: 18px;
            line-height: 1.4;
            word-break: break-word;
        ">
            {{ recipe.name }}
        </strong>

        <div style="
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        ">
            <button
                class="kr-button"
                type="button"
                onclick="location.href='{% url 'recipe_update' recipe.id %}?next={{ request.get_full_path|urlencode }}'"
                style="
                    background-color: #f2c94c;
                    border: 1px solid #999;
                    padding: 4px 10px;
                "
            >
                編集
            </button>

            <form
                method="post"
                action="{% url 'recipe_delete' recipe.id %}"
                style="margin: 0;"
            >
                {% csrf_token %}

                <button
                    class="kr-button kr-button--danger"
                    type="submit"
                    style="
                        background-color: #eb5757;
                        color: white;
                        border: 1px solid #999;
                        padding: 4px 10px;
                    "
                        data-confirm-message="⚠️警告
                        レシピ削除をすると登録された全工程も削除されます。
                        本当に削除しますか？"
                    >
                    削除
                </button>
            </form>
        </div>
    </div>

    <div style="
        text-align: center;
        margin-bottom: 20px;
    ">
        <button
            class="kr-button"
            type="button"
            onclick="location.href='{% url 'step_create' recipe.id %}'"
            style="
                background-color: #f2c94c;
                border: 1px solid #999;
                padding: 8px 16px;
            "
        >
            工程を追加
        </button>
    </div>

    {% if steps %}
        {% for step in steps %}
            <div class="kr-card" style="
                border: 1px solid #999;
                padding: 10px;
                margin-bottom: 10px;
                box-sizing: border-box;
            ">
                <div style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    gap: 12px;
                    font-size: 14px;
                ">
                    <span style="word-break: break-word;">
                        No.{{ step.order }}
                        {{ step.name }}
                    </span>

                    <div style="
                        display: flex;
                        gap: 8px;
                        flex-shrink: 0;
                    ">
                        <button
                            class="kr-button"
                            type="button"
                            onclick="location.href='{% url 'step_update' step.id %}'"
                            style="
                                background-color: #f2c94c;
                                border: 1px solid #999;
                                padding: 4px 10px;
                            "
                        >
                            編集
                        </button>

                        <form
                            method="post"
                            action="{% url 'step_delete' step.id %}"
                            style="margin: 0;"
                        >
                            {% csrf_token %}

                            <button
                                class="kr-button kr-button--danger"
                                type="submit"
                                style="
                                    background-color: #eb5757;
                                    color: white;
                                    border: 1px solid #999;
                                    padding: 4px 10px;
                                "
                                    data-confirm-message="⚠️警告
                                    この操作は元に戻せません。
                                    工程を削除しますか？"                            
                                >
                                削除
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p style="text-align: center; font-size: 14px;">
            登録された工程はありません。
        </p>
    {% endif %}

</div>

{% endblock %}
