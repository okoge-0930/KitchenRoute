{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitchenRoute ポートフォリオ</title>
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
</head>
<body>
    <main class="portfolio-page">
        <section class="portfolio-main">
            <div class="portfolio-text">
                <p class="portfolio-label">Portfolio</p>
                <h1>KitchenRoute</h1>
                <p>
                    調理工程の習得状況を管理するDjangoアプリです。
                </p>
                <a class="portfolio-button" href="{% url 'home' %}">
                    このアプリにアクセス
                </a>
            </div>

            <img
                class="portfolio-image"
                src="{% static 'portfolio/images/kitchenroute-screenshot.jpg' %}"
                alt="KitchenRouteのスクリーンショット"
            >
        </section>

        <section class="portfolio-documents">
            <h2>資料</h2>
            <ul>
                <li>
                    <a href="{% static 'portfolio/documents/plan.pdf' %}">
                        企画書
                    </a>
                </li>
                <li>
                    <a href="{% static 'portfolio/documents/screen.pdf' %}">
                        画面設計
                    </a>
                </li>
                <li>
                    <a href="{% static 'portfolio/documents/flow.pdf' %}">
                        画面遷移図
                    </a>
                </li>
                <li>
                    <a href="{% static 'portfolio/documents/er.pdf' %}">
                        ER図
                    </a>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
